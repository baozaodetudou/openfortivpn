[package]
name = "openfortivpn-manager-http"
version = "0.1.6"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
bytes = "1"
anyhow = "1"
axum = "0.8.9"
openfortivpn-manager-core = { path = "../manager-core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync", "time"] }
subtle = "2.6"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

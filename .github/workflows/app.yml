---
name: App CI

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # The C engine has its own Linux/Windows workflows. This job verifies the
      # Tauri shell without requiring a platform OpenSSL toolchain twice.
      OPENFORTIVPN_SKIP_ENGINE_BUILD: '1'
      OPENFORTIVPN_ALLOW_MISSING_ENGINE: '1'

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (Ubuntu 22.04)
            os: ubuntu-22.04
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-2022

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Svelte and TypeScript
        run: pnpm check

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Check Rust targets
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Run Rust Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features

      - name: Check privileged helper
        if: runner.os != 'Windows'
        run: |
          cargo fmt --manifest-path src-tauri/helper/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path src-tauri/helper/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/helper/Cargo.toml --all-targets

      - name: Build Tauri application without bundles
        run: pnpm tauri build --no-bundle

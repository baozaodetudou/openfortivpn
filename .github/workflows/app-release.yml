name: Desktop App Release

on:
  push:
    branches:
      - master
      - codex/vpn-manager-app
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Release quality gate
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend and Rust
        run: |
          pnpm check
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features
          cargo fmt --manifest-path src-tauri/helper/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path src-tauri/helper/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/helper/Cargo.toml --all-targets

      - name: Build and test VPN engine
        working-directory: ${{ github.workspace }}
        run: |
          cmake -S . -B build/release-quality -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/release-quality --parallel
          ctest --test-dir build/release-quality --output-on-failure

      - name: Check Linux headless manager
        working-directory: ${{ github.workspace }}
        run: |
          cargo fmt --manifest-path headless/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path headless/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path headless/Cargo.toml --all-targets

  bundle-unix:
    name: Bundle ${{ matrix.name }}
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux-x64
            os: ubuntu-22.04
            bundles: deb
            bundle_root: src-tauri/target/release/bundle
            artifact_root: app/src-tauri/target/release/bundle
          - name: macOS-arm64
            os: macos-14
            bundles: app,dmg
            rust_target: aarch64-apple-darwin
            cmake_arch: arm64
            runner_arch: arm64
            openssl_prefix: /opt/homebrew/opt/openssl@3
            bundle_root: src-tauri/target/aarch64-apple-darwin/release/bundle
            artifact_root: app/src-tauri/target/aarch64-apple-darwin/release/bundle
          - name: macOS-x86_64
            os: macos-15-intel
            bundles: app,dmg
            rust_target: x86_64-apple-darwin
            cmake_arch: x86_64
            runner_arch: x86_64
            openssl_prefix: /usr/local/opt/openssl@3
            bundle_root: src-tauri/target/x86_64-apple-darwin/release/bundle
            artifact_root: app/src-tauri/target/x86_64-apple-darwin/release/bundle

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget \
            xauth \
            xvfb \
            dbus-x11

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake openssl@3 pkg-config

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Rust target
        if: runner.os == 'macOS'
        run: rustup target add "${{ matrix.rust_target }}"

      - name: Configure macOS signing identity
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if test -z "$APPLE_CERTIFICATE" || test -z "$APPLE_CERTIFICATE_PASSWORD" || test -z "$KEYCHAIN_PASSWORD"; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::warning::Apple signing secrets are unavailable; publishing an ad-hoc signed prerelease"
            fi
            echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
            echo 'APPLE_NOTARIZATION_ENABLED=0' >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]] && { test -z "$APPLE_ID" || test -z "$APPLE_PASSWORD" || test -z "$APPLE_TEAM_ID"; }; then
            echo "::warning::Apple notarization credentials are unavailable; the tagged build will not be notarized"
          fi
          if test -n "$APPLE_ID" && test -n "$APPLE_PASSWORD" && test -n "$APPLE_TEAM_ID"; then
            printf 'APPLE_ID=%s\nAPPLE_PASSWORD=%s\nAPPLE_TEAM_ID=%s\n' \
              "$APPLE_ID" "$APPLE_PASSWORD" "$APPLE_TEAM_ID" >> "$GITHUB_ENV"
            echo 'APPLE_NOTARIZATION_ENABLED=1' >> "$GITHUB_ENV"
          else
            echo 'APPLE_NOTARIZATION_ENABLED=0' >> "$GITHUB_ENV"
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          identity=$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          test -n "$identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build architecture-matched macOS VPN engine
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = "${{ matrix.runner_arch }}"
          engine_build="$GITHUB_WORKSPACE/build/app-engine-${{ matrix.cmake_arch }}"
          cmake -S "$GITHUB_WORKSPACE" -B "$engine_build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.cmake_arch }}" \
            -DCMAKE_PREFIX_PATH="${{ matrix.openssl_prefix }}" \
            -DOPENSSL_ROOT_DIR="${{ matrix.openssl_prefix }}" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -DBUILD_TESTING=OFF
          cmake --build "$engine_build" --config Release --parallel
          mkdir -p src-tauri/resources/bin
          cp "$engine_build/openfortivpn" src-tauri/resources/bin/openfortivpn
          engine_archs=$(lipo -archs src-tauri/resources/bin/openfortivpn)
          test "$engine_archs" = "${{ matrix.cmake_arch }}"

      - name: Build platform bundles
        env:
          CMAKE_PREFIX_PATH: ${{ matrix.openssl_prefix }}
          OPENSSL_ROOT_DIR: ${{ matrix.openssl_prefix }}
          PKG_CONFIG_PATH: ${{ matrix.openssl_prefix && format('{0}/lib/pkgconfig', matrix.openssl_prefix) || '' }}
          OPENFORTIVPN_SKIP_ENGINE_BUILD: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            pnpm tauri build --bundles "${{ matrix.bundles }}" --target "${{ matrix.rust_target }}"
          else
            pnpm tauri build --bundles "${{ matrix.bundles }}"
          fi

      - name: Verify platform bundle
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            app_path="${{ matrix.bundle_root }}/macos/OpenFortiVPN Manager.app"
            codesign --verify --deep --strict "$app_path"
            manager_archs=$(lipo -archs "$app_path/Contents/MacOS/openfortivpn-manager")
            engine_archs=$(lipo -archs "$app_path/Contents/Resources/bin/openfortivpn")
            helper_archs=$(lipo -archs "$app_path/Contents/Resources/bin/openfortivpn-manager-helper")
            test "$manager_archs" = "${{ matrix.cmake_arch }}"
            test "$engine_archs" = "${{ matrix.cmake_arch }}"
            test "$helper_archs" = "${{ matrix.cmake_arch }}"
            if [[ "$GITHUB_REF" == refs/tags/* && "${APPLE_NOTARIZATION_ENABLED:-0}" == "1" ]]; then
              xcrun stapler validate "$app_path"
              spctl --assess --type execute --verbose "$app_path"
            fi
            "$app_path/Contents/Resources/bin/openfortivpn" --version
            "$app_path/Contents/MacOS/openfortivpn-manager" >"$RUNNER_TEMP/openfortivpn-manager.log" 2>&1 &
            app_pid=$!
            sleep 8
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/openfortivpn-manager.log"
              exit 1
            fi
            kill -TERM "$app_pid"
            wait "$app_pid" || true
          else
            deb=$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
            test -n "$deb"
            dpkg-deb -f "$deb" Depends | grep -q 'ppp'
            dpkg-deb -f "$deb" Depends | grep -q 'sudo'
            package_name=$(dpkg-deb -f "$deb" Package)
            sudo apt-get install -y "$PWD/$deb"
            engine=$(dpkg -L "$package_name" | grep '/bin/openfortivpn$' | head -1)
            helper=$(dpkg -L "$package_name" | grep '/bin/openfortivpn-manager-helper$' | head -1)
            app_binary=$(command -v openfortivpn-manager)
            test -x "$engine"
            test -x "$helper"
            test -x "$app_binary"
            "$engine" --version
            set +e
            WEBKIT_DISABLE_COMPOSITING_MODE=1 timeout --signal=TERM --kill-after=5s 12s \
              dbus-run-session -- xvfb-run -a "$app_binary" \
              >"$RUNNER_TEMP/openfortivpn-manager.log" 2>&1
            app_status=$?
            set -e
            if [[ "$app_status" -ne 124 ]]; then
              cat "$RUNNER_TEMP/openfortivpn-manager.log"
              exit 1
            fi
          fi

      - name: Generate SHA-256 checksums
        run: |
          checksum_file="${{ matrix.bundle_root }}/SHA256SUMS-${{ matrix.name }}.txt"
          find "${{ matrix.bundle_root }}" -type f \
            \( -name '*.deb' -o -name '*.dmg' \) -print0 |
            while IFS= read -r -d '' file; do
              hash=$(shasum -a 256 "$file" | awk '{print $1}')
              asset_name=$(basename "$file" | tr ' ' '.')
              printf '%s  %s\n' "$hash" "$asset_name"
            done | sort > "$checksum_file"
          test -s "$checksum_file"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: openfortivpn-manager-${{ matrix.name }}
          path: |
            ${{ matrix.artifact_root }}/**/*.deb
            ${{ matrix.artifact_root }}/**/*.dmg
            ${{ matrix.artifact_root }}/macos/*.app/**
            ${{ matrix.artifact_root }}/SHA256SUMS-*.txt
          if-no-files-found: error

  bundle-windows:
    name: Bundle Windows-x64
    needs: quality
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up MSYS2 engine toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl

      - name: Build Windows VPN engine
        shell: msys2 {0}
        run: |
          cmake -S . -B build/app-engine -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build/app-engine --parallel
          mkdir -p app/src-tauri/resources/bin
          cp build/app-engine/openfortivpn.exe app/src-tauri/resources/bin/
          cp /mingw64/bin/libssl-*.dll app/src-tauri/resources/bin/
          cp /mingw64/bin/libcrypto-*.dll app/src-tauri/resources/bin/
          cp /mingw64/bin/libwinpthread-*.dll app/src-tauri/resources/bin/ 2>/dev/null || true
          cp /mingw64/bin/libgcc_s_seh-*.dll app/src-tauri/resources/bin/ 2>/dev/null || true
          ./build/app-engine/openfortivpn.exe --version

      - name: Add Wintun runtime
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "$env:RUNNER_TEMP/wintun.zip"
          Expand-Archive "$env:RUNNER_TEMP/wintun.zip" -DestinationPath "$env:RUNNER_TEMP/wintun"
          Copy-Item "$env:RUNNER_TEMP/wintun/wintun/bin/amd64/wintun.dll" "app/src-tauri/resources/bin/wintun.dll"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Windows code signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD -or -not $env:WINDOWS_TIMESTAMP_URL) {
            if ($env:GITHUB_REF.StartsWith('refs/tags/')) {
              Write-Warning 'Authenticode secrets are unavailable; publishing an unsigned prerelease'
            }
            exit 0
          }
          $encoded = Join-Path $env:RUNNER_TEMP 'certificate.txt'
          $pfx = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
          Set-Content -Path $encoded -Value $env:WINDOWS_CERTIFICATE
          certutil -decode $encoded $pfx
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WINDOWS_TIMESTAMP_URL=$env:WINDOWS_TIMESTAMP_URL" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install and bundle application
        shell: pwsh
        working-directory: app
        env:
          OPENFORTIVPN_SKIP_ENGINE_BUILD: '1'
        run: |
          pnpm install --frozen-lockfile
          if ($env:WINDOWS_CERTIFICATE_THUMBPRINT) {
            $config = @{
              bundle = @{
                windows = @{
                  certificateThumbprint = $env:WINDOWS_CERTIFICATE_THUMBPRINT
                  digestAlgorithm = 'sha256'
                  timestampUrl = $env:WINDOWS_TIMESTAMP_URL
                }
              }
            } | ConvertTo-Json -Depth 4 -Compress
            pnpm tauri build --bundles nsis,msi --config $config
          } else {
            pnpm tauri build --bundles nsis,msi
          }

      - name: Validate Windows manifest and signatures
        shell: pwsh
        run: |
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter mt.exe |
            Where-Object { $_.FullName -match '\\x64\\mt.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $mt) { throw 'mt.exe was not found' }
          & $mt.FullName -manifest app/src-tauri/windows-app-manifest.xml -validate_manifest
          if ($env:GITHUB_REF.StartsWith('refs/tags/') -and $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
            Get-ChildItem app/src-tauri/target/release/bundle -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.msi' } |
              ForEach-Object { Get-AuthenticodeSignature $_.FullName } |
              ForEach-Object { if ($_.Status -ne 'Valid') { throw "Invalid signature: $($_.Path)" } }
          }

      - name: Install and smoke-test Windows package
        shell: pwsh
        run: |
          $msi = Get-ChildItem app/src-tauri/target/release/bundle/msi -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw 'MSI package was not produced' }
          $quotedMsi = "`"$($msi.FullName)`""
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $quotedMsi, '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -notin 0, 3010) { throw "MSI installation failed with $($install.ExitCode)" }

          $installRoot = Join-Path $env:ProgramFiles 'OpenFortiVPN Manager'
          if (-not (Test-Path $installRoot)) { throw "Installation directory was not created: $installRoot" }
          $engine = Get-ChildItem $installRoot -Recurse -Filter openfortivpn.exe | Select-Object -First 1
          $manager = Get-ChildItem $installRoot -Recurse -Filter openfortivpn-manager.exe | Select-Object -First 1
          $wintun = Get-ChildItem $installRoot -Recurse -Filter wintun.dll | Select-Object -First 1
          $ssl = Get-ChildItem $installRoot -Recurse -Filter 'libssl-*.dll' | Select-Object -First 1
          $crypto = Get-ChildItem $installRoot -Recurse -Filter 'libcrypto-*.dll' | Select-Object -First 1
          if (-not $engine -or -not $manager -or -not $wintun -or -not $ssl -or -not $crypto) {
            throw 'Installed package is missing the manager, engine, Wintun or OpenSSL runtime'
          }
          & $engine.FullName --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed VPN engine did not start' }

          $managerProcess = Start-Process $manager.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($managerProcess.HasExited) { throw "Installed manager exited with $($managerProcess.ExitCode)" }
          Stop-Process -Id $managerProcess.Id
          $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', $quotedMsi, '/qn', '/norestart') -Wait -PassThru
          if ($uninstall.ExitCode -notin 0, 3010) { throw "MSI uninstall failed with $($uninstall.ExitCode)" }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $bundleRoot = Resolve-Path "app/src-tauri/target/release/bundle"
          $checksumFile = Join-Path $bundleRoot "SHA256SUMS-Windows-x64.txt"
          $lines = Get-ChildItem $bundleRoot -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.msi' } |
            Sort-Object FullName |
            ForEach-Object {
              $assetName = $_.Name -replace ' ', '.'
              "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $assetName
            }
          if (-not $lines) { throw "No Windows installers were produced" }
          [System.IO.File]::WriteAllText(
            $checksumFile,
            (($lines -join "`n") + "`n"),
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: openfortivpn-manager-Windows-x64
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/SHA256SUMS-Windows-x64.txt
          if-no-files-found: error

  bundle-headless-linux:
    name: Bundle Linux headless CLI
    needs: quality
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake curl libssl-dev pkg-config ppp

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: headless -> target

      - name: Build headless manager and VPN engine
        run: |
          cargo build --locked --release --manifest-path headless/Cargo.toml
          cmake -S . -B build/headless-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -DBUILD_TESTING=OFF
          cmake --build build/headless-release --parallel
          headless/target/release/openfortivpn-manager-headless --help
          build/headless-release/openfortivpn --version

      - name: Create tar and Debian packages
        run: |
          version=$(awk -F'"' '/^version = "/ { print $2; exit }' headless/Cargo.toml)
          test -n "$version"
          artifact_dir="$GITHUB_WORKSPACE/headless-dist"
          archive_root="$artifact_dir/openfortivpn-manager-headless-linux-x86_64"
          deb_root="$RUNNER_TEMP/openfortivpn-manager-headless_${version}_amd64"
          mkdir -p "$archive_root/bin" "$archive_root/libexec" "$archive_root/examples"
          install -m 0755 headless/target/release/openfortivpn-manager-headless \
            "$archive_root/bin/openfortivpn-manager-headless"
          install -m 0755 build/headless-release/openfortivpn \
            "$archive_root/libexec/openfortivpn"
          install -m 0755 headless/scripts/install-bundle.sh "$archive_root/install.sh"
          install -m 0644 headless/README.md "$archive_root/README.md"
          cp -a headless/examples/. "$archive_root/examples/"
          tar -C "$artifact_dir" -czf \
            "$artifact_dir/openfortivpn-manager-headless_${version}_linux_x86_64.tar.gz" \
            "$(basename "$archive_root")"

          mkdir -p "$deb_root/DEBIAN" \
            "$deb_root/usr/local/sbin" \
            "$deb_root/usr/local/libexec/openfortivpn-manager-headless" \
            "$deb_root/usr/share/doc/openfortivpn-manager-headless/examples"
          sed "s/^Version:.*/Version: $version/" headless/packaging/debian/control \
            > "$deb_root/DEBIAN/control"
          install -m 0755 headless/packaging/debian/postinst "$deb_root/DEBIAN/postinst"
          install -m 0755 headless/packaging/debian/prerm "$deb_root/DEBIAN/prerm"
          install -m 0755 headless/target/release/openfortivpn-manager-headless \
            "$deb_root/usr/local/sbin/openfortivpn-manager-headless"
          install -m 0755 build/headless-release/openfortivpn \
            "$deb_root/usr/local/libexec/openfortivpn-manager-headless/openfortivpn"
          install -m 0644 headless/README.md \
            "$deb_root/usr/share/doc/openfortivpn-manager-headless/README.md"
          cp -a headless/examples/. \
            "$deb_root/usr/share/doc/openfortivpn-manager-headless/examples/"
          dpkg-deb --build --root-owner-group "$deb_root" \
            "$artifact_dir/openfortivpn-manager-headless_${version}_amd64.deb"

      - name: Install and smoke-test headless Debian package
        run: |
          deb=$(find "$GITHUB_WORKSPACE/headless-dist" -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$deb"
          sudo apt-get install -y "$deb"
          sudo systemctl is-active --quiet openfortivpn-manager-headless.service
          ready=0
          for _attempt in {1..30}; do
            if curl --fail --silent --insecure https://127.0.0.1:18443/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            sudo journalctl -u openfortivpn-manager-headless.service --no-pager -n 100
            exit 1
          fi
          token=$(sudo openfortivpn-manager-headless token)
          curl --fail --silent --show-error --insecure \
            -H "Authorization: Bearer $token" \
            https://127.0.0.1:18443/api/v1/snapshot
          sudo apt-get remove -y openfortivpn-manager-headless

      - name: Generate SHA-256 checksums
        run: |
          cd headless-dist
          sha256sum ./*.deb ./*.tar.gz > SHA256SUMS-Linux-headless-x86_64.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: openfortivpn-manager-Linux-headless-x86_64
          path: |
            headless-dist/*.deb
            headless-dist/*.tar.gz
            headless-dist/SHA256SUMS-*.txt
          if-no-files-found: error

  publish:
    name: Publish tagged desktop release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [bundle-unix, bundle-windows, bundle-headless-linux]
    runs-on: ubuntu-22.04
    steps:
      - name: Download all verified platform artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish one complete GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenFortiVPN Manager ${{ github.ref_name }}
          prerelease: ${{ vars.OFFICIAL_SIGNED_RELEASE != 'true' }}
          body: |
            ## 安装包 / Packages

            本版本包含 macOS Apple Silicon、macOS Intel、Windows x64、Linux
            桌面版以及 Linux headless 安装包。所有附件均由本标签的 CI 构建并
            经过平台烟测，校验文件见 `SHA256SUMS-*.txt`。

            > 当前仓库尚未配置 Apple Developer ID、公证和 Windows
            > Authenticode secrets，因此该版本作为预发布提供。macOS 可能需要
            > 手动允许应用，Windows 可能显示 SmartScreen 提示。正式分发前请配置
            > 签名 secrets，并把仓库变量 `OFFICIAL_SIGNED_RELEASE` 设为 `true`。

            使用说明见项目根目录 `README.md`、`docs/user-guide.zh-CN.md` 和
            `headless/README.md`。
          files: |
            release-assets/**/*.deb
            release-assets/**/*.dmg
            release-assets/**/*.exe
            release-assets/**/*.msi
            release-assets/**/*.tar.gz
            release-assets/**/SHA256SUMS-*.txt
          generate_release_notes: true
